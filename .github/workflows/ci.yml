# CI mirrors the local pre-commit gates and the test suite.
# Windows is listed first because it is the primary target platform.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      # Install into a project venv (never --system: CI runners have an
      # externally-managed system Python). uv run then uses that venv.
      - name: Install project + dev tooling
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint + format (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Docstring coverage (interrogate)
        run: uv run interrogate -c pyproject.toml .

      # bash on both OSes (Git bash on Windows) so git ls-files word-splits.
      - name: Custom discipline hooks
        shell: bash
        run: |
          uv run python tools/hooks/check_file_length.py $(git ls-files '*.py')
          uv run python tools/hooks/check_port_boundary.py $(git ls-files '*.py')
          uv run python tools/hooks/check_single_source.py

      # Duplicate-code detection needs node/npx (jscpd is an npm tool). Run it
      # on Linux only — one OS is enough for a source-level check, and it keeps
      # the Windows job free of a node toolchain it doesn't otherwise need.
      - name: Set up Node (for jscpd)
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Duplicate-code detection (jscpd)
        if: runner.os == 'Linux'
        run: npx --yes jscpd@4 --threshold 0 --min-tokens 50 --exitCode 1 core ports adapters api

      # The full suite, including the `slow` full-sim / cross-backend tests that
      # the local pre-commit fast subset skips.
      - name: Tests
        run: uv run pytest
