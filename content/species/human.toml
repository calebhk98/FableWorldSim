# Humans — the baseline sapient surface race: fast growth, balanced
# research, and a cultural pull toward farming and the sea.  Display name
# is the Fluent key species-human in content/locales.
sapient = true
domain = "surface"
growth_rate_per_year = 0.025
commit_fraction = 0.12
research_aptitude = 1.0
mine_affinity = 1.0
color = "#C08A52"
toponym_prefixes = ["Ash", "Bright", "Stone", "River", "Fair", "Oak"]
toponym_suffixes = ["ford", "ton", "burgh", "dale", "haven", "mere"]

# Ecology (read by the biology loader): an omnivorous generalist that
# thrives across a wide range of climates.
medium = "terrestrial"
body_mass_kg = 70
crowding_cap_per_m2 = 1e-4
lifespan_years = 70
maturity_years = 15
litter_size = 1.1

# Per-tech research propensity weights (unlisted techs default to 1.0).
[propensity]
agriculture = 1.4
sailing = 1.5
shipbuilding = 1.3

[traits.temperature_k]
comfort_min = 283
comfort_max = 303
tolerance_min = 265
tolerance_max = 315
spread = 5.0

[traits.precipitation_mm_yr]
comfort_min = 300
comfort_max = 1500
tolerance_min = 50
tolerance_max = 3500
spread = 150

[traits.altitude_m]
comfort_min = 0
comfort_max = 2000
tolerance_min = -200
tolerance_max = 4500
spread = 200

[diet]
aurochs = 0.7
deer = 0.5
grass = 0.2
oak = 0.1
