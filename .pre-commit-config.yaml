# Discipline gates run on every local commit and re-run identically in CI.
# See docs/CONTRIBUTING.md for the red->green TDD workflow these support.
repos:
  # --- Format + lint (includes never-nesting PLR1702, complexity C901, docstrings D) ---
  # Keep this rev in the same minor line as the ruff pin in pyproject dev
  # deps, or the local hook and CI will disagree about rules.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # --- Static types ---
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        # Everything `files = [core, ports, adapters, api]` imports statically;
        # optional grid/GPU libs are covered by the stubs in adapters/stubs/.
        additional_dependencies:
          [pydantic>=2.6, numpy>=1.26, pydantic-settings>=2.2, fastapi>=0.110]
        pass_filenames: false

  # --- Docstring coverage (good-commenting requirement) ---
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        # Use pyproject paths/excludes (tests are exempt there, matching
        # ruff's D ignore) instead of the staged-file list.
        pass_filenames: false

  # --- Duplicate-code detection across Python + TypeScript ---
  # Runs via npx: the upstream repo is an npm monorepo whose root package does
  # not expose the jscpd bin, so pre-commit's node install can't provide it
  # (the old pinned rev v4.0.5 never existed at all). Requires node, which the
  # TypeScript web client needs anyway.
  - repo: local
    hooks:
      - id: jscpd
        name: Check for duplicated code
        entry: npx --yes jscpd@4 --threshold 0 --min-tokens 50 --exitCode 1 core ports adapters api
        language: system
        always_run: true
        pass_filenames: false

  # --- Project-local guards (see tools/hooks) ---
  - repo: local
    hooks:
      - id: file-length
        name: file length limit
        entry: python tools/hooks/check_file_length.py
        language: system
        types: [python]
      - id: port-boundary
        name: core imports ports only
        entry: python tools/hooks/check_port_boundary.py
        language: system
        types: [python]
      - id: single-source-of-truth
        name: content ids defined once (locales reference them, core never hard-codes them)
        entry: python tools/hooks/check_single_source.py
        language: system
        always_run: true
        pass_filenames: false

      # Fast test subset on every commit: everything except the `slow` marker
      # (full-sim / cross-backend / end-to-end). CI runs the whole suite.
      - id: pytest-fast
        name: fast test subset (excludes slow / full-sim tests)
        entry: python -m pytest -m "not slow" -q
        language: system
        always_run: true
        pass_filenames: false
